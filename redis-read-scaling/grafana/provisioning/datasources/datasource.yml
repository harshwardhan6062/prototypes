apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned so the dashboard JSON can reference it by uid. Without this Grafana
    # generates a random uid and every panel renders "datasource not found".
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 2s
